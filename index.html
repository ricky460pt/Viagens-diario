<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="45700.jpg">
<title>Diário Pro v7.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
:root {
  --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b;
  --line: #e2e8f0; --accent: #2563eb; --accent-light: #eff6ff;
  --danger: #ef4444; --warn: #d97706; --warn-bg: rgba(217, 119, 6, 0.12);
  --nav-bg: #ffffff; --input-bg: #f8fafc;
}
body.dark {
  --bg: #0b1329; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8;
  --line: #334155; --accent: #3b82f6; --accent-light: rgba(59, 130, 246, 0.15);
  --danger: #f87171; --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, 0.14);
  --nav-bg: #1e293b; --input-bg: #0f172a;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; padding-bottom: env(safe-area-inset-bottom); transition: background 0.3s, color 0.3s; }

header { background: #0b1220; color: white; padding: 18px 16px 35px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; position: relative; z-index: 1; }
header .top { max-width: 900px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
h1 { font-size: 20px; margin: 0; font-weight: 800; display: flex; align-items: center; gap: 10px; }
h1 img { height: 32px; width: 32px; border-radius: 8px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
.badge { font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 20px; letter-spacing: 0.5px; transition: 0.2s; }

nav { background: var(--nav-bg); display: flex; justify-content: space-between; padding: 8px; max-width: 900px; margin: -20px auto 0; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); position: relative; z-index: 10; width: calc(100% - 32px); transition: background 0.3s; }
nav button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; background: transparent; color: var(--muted); border: none; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
nav button.active { background: var(--accent-light); color: var(--accent); }
.ic { font-size: 18px; }

@media (max-width: 650px) {
  nav { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; margin: 0; border-radius: 24px 24px 0 0; padding: 10px 8px calc(15px + env(safe-area-inset-bottom)); box-shadow: 0 -5px 25px rgba(0,0,0,0.1); gap: 0; }
  nav button { flex-direction: column; gap: 4px; padding: 8px 4px; font-size: 10px; }
  .ic { font-size: 22px; margin-bottom: 2px; }
  main { margin-bottom: 90px; }
}

main { max-width: 900px; margin: auto; padding: 24px 16px; }
.card { background: var(--card); border-radius: 22px; padding: 22px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--line); transition: background 0.3s, border-color 0.3s; }
h2 { font-size: 18px; margin: 0 0 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.full { grid-column: 1 / -1; }
label { font-size: 12px; font-weight: 800; display: block; margin-bottom: 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
input, select, textarea { font: inherit; border-radius: 14px; padding: 14px; border: 1.5px solid var(--line); background: var(--input-bg); color: var(--text); width: 100%; transition: 0.2s; font-weight: 600; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37,99,235,0.1); background: var(--card); }
textarea { min-height: 90px; }

button { font: inherit; border: none; cursor: pointer; transition: 0.2s; font-weight: 750; border-radius: 14px; padding: 14px; width: 100%; }
button.primary { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.25); }
button.primary:active { transform: scale(0.97); }
button.secondary { background: var(--input-bg); color: var(--text); border: 1px solid var(--line); }
button.danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
.row { display: flex; gap: 10px; } .row > * { flex: 1; }

.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
.kpi b { font-size: 26px; display: block; color: var(--accent); font-weight: 800; margin-bottom: 4px; }
.kpi span { font-size: 11px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

.smart-results { position: absolute; z-index: 100; background: var(--card); border: 1px solid var(--line); border-radius: 14px; max-height: 200px; overflow-y: auto; width: calc(100% - 2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); display: none; margin-top: 4px; }

.trip { border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 12px; background: var(--card); transition: 0.2s; display: flex; flex-direction: column; gap: 10px; }
.trip:active { background: var(--input-bg); }
.trip-title { font-size: 15px; font-weight: 800; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.trip-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: var(--input-bg); padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); }
.actions { display: flex; gap: 8px; margin-top: 4px; }
.actions button { padding: 10px; font-size: 12px; }

.item { padding: 14px; border: 1px solid var(--line); border-radius: 16px; margin-top: 10px; background: var(--card); }
.item-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 15px; margin-bottom: 4px; }
.item-sub { font-size: 13px; color: var(--muted); font-weight: 600; }

.notice { font-size: 13px; color: var(--muted); background: var(--input-bg); padding: 16px; border-radius: 14px; border-left: 4px solid var(--accent); font-weight: 600; line-height: 1.5; }
.backup-reminder { display: none; font-size: 12px; color: var(--warn); background: var(--warn-bg); padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(217, 119, 6, 0.28); font-weight: 700; margin-bottom: 16px; line-height: 1.4; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; font-weight: 700; }

.view { display: none; animation: fadeIn 0.3s ease-out; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

@media(max-width: 650px) { .grid { grid-template-columns: 1fr; gap: 12px; } .full { grid-column: auto; } header { padding-bottom: 25px; } }
</style>
</head>
<body>
<header><div class="top">
  <h1><img src="45700.jpg" alt="Logo"> Diário Pro <span style="font-size:12px; opacity:0.7">v7.2</span></h1>
  <button id="themeToggle" class="badge" style="border:1px solid rgba(255,255,255,0.3); color:white; cursor:pointer;">🌓 Tema</button>
</div></header>

<nav>
<button data-v="home" class="active"><span class="ic">🏠</span> <span class="tx">Início</span></button>
<button data-v="trip"><span class="ic">➕</span> <span class="tx">Viagem</span></button>
<button data-v="calendar"><span class="ic">📅</span> <span class="tx">Calendário</span></button>
<button data-v="report"><span class="ic">📊</span> <span class="tx">Relatórios</span></button>
<button data-v="db"><span class="ic">🗂️</span> <span class="tx">Cadastros</span></button>
<button data-v="history"><span class="ic">📋</span> <span class="tx">Histórico</span></button>
</nav>

<main>
<section id="home" class="view active">
<div id="backupReminder" class="backup-reminder"></div>
<div style="margin-bottom: 12px; text-align: center;"><span id="periodLabel" class="badge" style="background:var(--accent-light); color:var(--accent); font-size:12px; border:1px solid var(--line);">Período: --/-- a --/--</span></div>
<div class="kpis" style="margin-bottom: 20px;">
  <div class="kpi"><b id="hkTrips">0</b><span>Viagens do Período</span></div>
  <div class="kpi"><b id="hkDays">0</b><span>Dias Trabalhados</span></div>
</div>
<div class="card" style="background: transparent; border: none; box-shadow: none; padding: 0;">
  <button type="button" class="primary" style="padding: 18px; font-size: 16px; margin-bottom: 12px;" onclick="openNewTrip()">➕ NOVA VIAGEM</button>
  <button type="button" class="secondary" style="background: var(--accent-light); color: var(--accent); font-weight:700;" onclick="emergencyBackup()">💾 GUARDAR CÓPIA DE SEGURANÇA</button>
</div>
</section>

<section id="trip" class="view"><div class="card"><h2 id="formTitle">➕ Registar viagem</h2><form id="form" class="grid">
<div class="full" style="background:var(--accent-light); padding:16px; border:1px solid var(--accent); border-radius:16px; margin-bottom:8px;">
  <label style="color:var(--accent)">⭐ Rota Habitual (Preenchimento rápido)</label>
  <select id="tripRouteQuick" style="margin-top:8px; font-weight: 700;"></select>
</div>
<div><label>Data</label><input id="date" type="date" required></div><div><label>N.º viagem</label><input id="number"></div>

<div style="position:relative"><label>Camião</label><input id="truckSearch" placeholder="Escrever ou escolher..." autocomplete="off"><div id="truckResults" class="smart-results"></div></div>
<div style="position:relative"><label>Reboque</label><input id="trailerSearch" placeholder="Escrever ou escolher..." autocomplete="off"><div id="trailerResults" class="smart-results"></div></div>
<div style="position:relative"><label>Cliente</label><input id="clientSearch" placeholder="Escrever ou escolher..." autocomplete="off"><div id="clientResults" class="smart-results"></div></div>
<div><label>Valor (€)</label><input id="value" type="number" min="0" step=".01"></div>

<div class="full" style="position:relative"><label>Local de carga</label><input id="loadSearch" placeholder="Onde carregou?" autocomplete="off"><div id="loadResults" class="smart-results"></div></div>
<div class="full" style="position:relative"><label>Local de descarga</label><input id="unloadSearch" placeholder="Onde descarregou?" autocomplete="off"><div id="unloadResults" class="smart-results"></div></div>
<div class="full"><label>Observações</label><textarea id="notes" placeholder="Detalhes extra (opcional)"></textarea></div>
<div class="full row" style="margin-top:8px"><button type="submit" id="mainSubmitBtn" class="primary">GUARDAR VIAGEM</button><button type="button" class="secondary" id="clear">Limpar</button>
