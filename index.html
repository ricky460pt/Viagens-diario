@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
:root {
  --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b;
  --line: #e2e8f0; --accent: #2563eb; --accent-light: #eff6ff;
  --danger: #ef4444; --warn: #d97706; --warn-bg: rgba(217, 119, 6, 0.12);
  --nav-bg: #ffffff; --input-bg: #f8fafc;
}
body.dark {
  --bg: #0b1329; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8;
  --line: #334155; --accent: #3b82f6; --accent-light: rgba(59, 130, 246, 0.15);
  --danger: #f87171; --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, 0.14);
  --nav-bg: #1e293b; --input-bg: #0f172a;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; padding-bottom: env(safe-area-inset-bottom); transition: background 0.3s, color 0.3s; }

header { background: #0b1220; color: white; padding: 18px 16px 35px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; position: relative; z-index: 1; }
header .top { max-width: 900px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
h1 { font-size: 20px; margin: 0; font-weight: 800; display: flex; align-items: center; gap: 10px; }
h1 img { height: 32px; width: 32px; border-radius: 8px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
.badge { font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 20px; letter-spacing: 0.5px; transition: 0.2s; }

nav { background: var(--nav-bg); display: flex; justify-content: space-between; padding: 8px; max-width: 900px; margin: -20px auto 0; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); position: relative; z-index: 10; width: calc(100% - 32px); transition: background 0.3s; }
nav button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; background: transparent; color: var(--muted); border: none; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
nav button.active { background: var(--accent-light); color: var(--accent); }
.ic { font-size: 18px; }

@media (max-width: 650px) {
  nav { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; margin: 0; border-radius: 24px 24px 0 0; padding: 10px 8px calc(15px + env(safe-area-inset-bottom)); box-shadow: 0 -5px 25px rgba(0,0,0,0.1); gap: 0; }
  nav button { flex-direction: column; gap: 4px; padding: 8px 4px; font-size: 10px; }
  .ic { font-size: 22px; margin-bottom: 2px; }
  main { margin-bottom: 90px; }
}

main { max-width: 900px; margin: auto; padding: 24px 16px; }
.card { background: var(--card); border-radius: 22px; padding: 22px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--line); transition: background 0.3s, border-color 0.3s; }
h2 { font-size: 18px; margin: 0 0 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.full { grid-column: 1 / -1; }
label { font-size: 12px; font-weight: 800; display: block; margin-bottom: 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
input, select, textarea { font: inherit; border-radius: 14px; padding: 14px; border: 1.5px solid var(--line); background: var(--input-bg); color: var(--text); width: 100%; transition: 0.2s; font-weight: 600; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37,99,235,0.1); background: var(--card); }
textarea { min-height: 90px; }

button { font: inherit; border: none; cursor: pointer; transition: 0.2s; font-weight: 750; border-radius: 14px; padding: 14px; width: 100%; }
button.primary { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.25); }
button.primary:active { transform: scale(0.97); }
button.secondary { background: var(--input-bg); color: var(--text); border: 1px solid var(--line); }
button.danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
.row { display: flex; gap: 10px; } .row > * { flex: 1; }
